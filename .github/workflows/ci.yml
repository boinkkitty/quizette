name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a main run: Render deploys main only once its checks pass.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quizette, POSTGRES_PASSWORD: quizette, POSTGRES_DB: quizette }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U quizette" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: "backend/go.sum" }
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: sqlc generated code is up to date
        run: go tool sqlc diff
      - name: Format
        run: go tool -modfile=tools/golangci.mod golangci-lint fmt --diff ./...
      - name: Lint
        run: go tool -modfile=tools/golangci.mod golangci-lint run ./...
      - name: Unit + integration tests
        run: go test -race -tags integration ./...
        env:
          TEST_DATABASE_URL: postgres://quizette:quizette@localhost:5432/quizette?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Typecheck, lint, format check and unit tests.
      - run: pnpm check
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      # The route tree is committed so tsc can run before Vite; the build regenerates it.
      - name: Generated route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
        working-directory: frontend

  # Known vulnerabilities in dependencies. A separate job, because a newly published
  # advisory can fail it without any change in the PR.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: "backend/go.sum" }
      - name: govulncheck
        run: go tool -modfile=tools/govulncheck.mod govulncheck ./...
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: pnpm audit (frontend)
        run: pnpm audit --prod --audit-level high
        working-directory: frontend

  # The image Render deploys (API with the frontend embedded) must still build.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: quizette, POSTGRES_PASSWORD: quizette, POSTGRES_DB: quizette }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U quizette" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: backend/go.mod, cache-dependency-path: "backend/go.sum" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: e2e/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: "**/pnpm-lock.yaml" }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test
        working-directory: e2e
        env:
          DATABASE_URL: postgres://quizette:quizette@localhost:5432/quizette?sslmode=disable
          E2E_API_PORT: "8080"
          E2E_WEB_PORT: "5173"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

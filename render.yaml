services:
  - type: web
    name: quizette-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: PUBLIC_URL
        sync: false # Cloudflare Worker origin, e.g. https://quizette.<you>.workers.dev
      - key: GEMINI_API_KEY
        sync: false
      - key: GENERATION_STRATEGY
        value: pdf-native
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

services:
  - type: web
    name: quizette-api
    runtime: docker
    # The image holds the API and the embedded frontend, so it builds from the repo root.
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    # Deploy a commit to main only once its GitHub checks have passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: PUBLIC_URL
        sync: false # this service's own URL, e.g. https://quizette-api.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GENERATION_STRATEGY
        value: pdf-native
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
      - key: OPENROUTER_API_KEY
        sync: false # optional: backup provider when every Gemini model is busy
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

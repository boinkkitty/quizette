services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizette
      POSTGRES_PASSWORD: quizette
      POSTGRES_DB: quizette
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizette"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
